services:
  app_proxy:
    environment:
      APP_HOST: seymour-blockchain-manager_web_1
      APP_PORT: 8080

  web:
    image: python:3.12-alpine
    restart: on-failure
    working_dir: /app

    command:
      - python
      - /app/app.py

    environment:
      PROVIDER_CATALOG_PATH: /catalog/providers.v1.json
      BCH_APP_ID: seymour-bch-node

    volumes:
      - ${APP_DATA_DIR}/data/web:/app:ro
      - ${APP_DATA_DIR}/data/catalog:/catalog:ro
