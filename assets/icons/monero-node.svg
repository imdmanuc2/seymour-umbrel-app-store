<svg xmlns="http://www.w3.org/2000/svg"
 viewBox="0 0 512 512"
 role="img"
 aria-labelledby="title desc">
<title>MONERO</title>
<desc>Premium Seymour MONERO blockchain runtime icon</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#151b31"/>
    <stop offset=".52" stop-color="#080b18"/>
    <stop offset="1" stop-color="#02040b"/>
  </linearGradient>

  <radialGradient id="coin" cx=".35" cy=".28" r=".8">
    <stop offset="0" stop-color="#ff6b35"/>
    <stop offset=".68" stop-color="#ff3d00"/>
    <stop offset="1" stop-color="#111827"/>
  </radialGradient>

  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff9068"/>
    <stop offset=".45" stop-color="#ff6b35"/>
    <stop offset="1" stop-color="#ff3d00"/>
  </linearGradient>

  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="18"/>
  </filter>

  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
</defs>

<!-- Umbrel-style rounded application tile -->
<rect x="12" y="12" width="488" height="488" rx="112"
 fill="url(#bg)"/>

<!-- ambient colored lighting -->
<circle cx="160" cy="130" r="145"
 fill="#ff6b35" opacity=".13" filter="url(#shadow)"/>

<circle cx="378" cy="382" r="135"
 fill="#ff3d00" opacity=".16" filter="url(#shadow)"/>

<!-- decorative network -->
<g fill="none" stroke="#ff9068" stroke-width="4" opacity=".22">
  <path d="M72 334L143 285L200 325"/>
  <path d="M310 111L374 154L433 118"/>
  <path d="M329 371L390 331L448 365"/>
</g>

<g fill="#ff9068" opacity=".65">
  <circle cx="72" cy="334" r="6"/>
  <circle cx="143" cy="285" r="6"/>
  <circle cx="200" cy="325" r="6"/>
  <circle cx="310" cy="111" r="6"/>
  <circle cx="374" cy="154" r="6"/>
  <circle cx="433" cy="118" r="6"/>
  <circle cx="329" cy="371" r="6"/>
  <circle cx="390" cy="331" r="6"/>
  <circle cx="448" cy="365" r="6"/>
</g>

<!-- coin glow -->
<circle cx="256" cy="245" r="150"
 fill="#ff9068" opacity=".18" filter="url(#soft)"/>

<!-- outer metallic rings -->
<circle cx="256" cy="245" r="143"
 fill="#070a13"
 stroke="url(#ring)"
 stroke-width="9"/>

<circle cx="256" cy="245" r="124"
 fill="url(#coin)"
 stroke="#ff9068"
 stroke-opacity=".55"
 stroke-width="4"/>

<!-- inner detail -->
<circle cx="256" cy="245" r="104"
 fill="none"
 stroke="#ffffff"
 stroke-opacity=".15"
 stroke-width="3"/>

<path d="M180 171
 C217 130 295 127 335 168"
 fill="none"
 stroke="#fff"
 stroke-width="12"
 stroke-linecap="round"
 opacity=".17"/>

<!-- symbol -->
<text x="256"
 y="286"
 text-anchor="middle"
 font-family="Arial,Helvetica,sans-serif"
 font-size="150"
 font-weight="900"
 fill="#ffffff"
 stroke="#000000"
 stroke-opacity=".22"
 stroke-width="3"
 paint-order="stroke">
M
</text>

<!-- bottom identity plate -->
<rect x="113" y="414" width="286" height="48" rx="24"
 fill="#050711"
 stroke="#ff6b35"
 stroke-opacity=".48"
 stroke-width="2"/>

<text x="256"
 y="445"
 text-anchor="middle"
 font-family="Arial,Helvetica,sans-serif"
 font-size="20"
 font-weight="800"
 letter-spacing="2"
 fill="#ffffff"
 opacity=".94">
MONERO
</text>

<!-- premium border -->
<rect x="18" y="18" width="476" height="476" rx="106"
 fill="none"
 stroke="#ffffff"
 stroke-opacity=".09"
 stroke-width="3"/>
</svg>
