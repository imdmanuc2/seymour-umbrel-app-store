<svg xmlns="http://www.w3.org/2000/svg"
 viewBox="0 0 512 512" role="img">
 <defs>
   <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
     <stop offset="0" stop-color="#111827"/>
     <stop offset="1" stop-color="#020617"/>
   </linearGradient>

   <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
     <stop offset="0" stop-color="#059669"/>
     <stop offset="1" stop-color="#34D399"/>
   </linearGradient>

   <radialGradient id="shine" cx="32%" cy="22%" r="78%">
     <stop offset="0" stop-color="#FFFFFF" stop-opacity=".34"/>
     <stop offset=".36" stop-color="#FFFFFF" stop-opacity=".07"/>
     <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
   </radialGradient>

   <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
     <feDropShadow dx="0" dy="18" stdDeviation="20"
       flood-color="#000000" flood-opacity=".48"/>
   </filter>

   <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
     <feGaussianBlur stdDeviation="16" result="blur"/>
     <feMerge>
       <feMergeNode in="blur"/>
       <feMergeNode in="SourceGraphic"/>
     </feMerge>
   </filter>
 </defs>

 <rect
   x="8"
   y="8"
   width="496"
   height="496"
   rx="112"
   fill="url(#tile)"
   stroke="#FFFFFF"
   stroke-opacity=".08"
   stroke-width="4"/>

 <circle
   cx="256"
   cy="224"
   r="160"
   fill="#059669"
   opacity=".14"
   filter="url(#glow)"/>

 <circle
   cx="256"
   cy="224"
   r="148"
   fill="url(#brand)"
   filter="url(#shadow)"/>

 <circle
   cx="256"
   cy="224"
   r="123"
   fill="#07101F"
   fill-opacity=".36"
   stroke="#FFFFFF"
   stroke-opacity=".20"
   stroke-width="4"/>

 <circle
   cx="256"
   cy="224"
   r="146"
   fill="url(#shine)"/>

 <path
   d="M157 332 C207 362 305 362 355 332"
   fill="none"
   stroke="#FFFFFF"
   stroke-opacity=".18"
   stroke-width="4"
   stroke-linecap="round"/>

 <text
   x="256"
   y="273"
   text-anchor="middle"
   font-family="Arial,Helvetica,sans-serif"
   font-size="148"
   font-weight="800"
   fill="#FFFFFF"
   filter="url(#shadow)">✚</text>

 <rect
   x="136"
   y="397"
   width="240"
   height="58"
   rx="29"
   fill="#FFFFFF"
   fill-opacity=".08"
   stroke="#FFFFFF"
   stroke-opacity=".15"
   stroke-width="2"/>

 <text
   x="256"
   y="435"
   text-anchor="middle"
   font-family="Arial,Helvetica,sans-serif"
   font-size="24"
   font-weight="800"
   letter-spacing="3"
   fill="#FFFFFF">DIAG</text>
</svg>
