services:
  app_proxy:
    environment:
      APP_HOST: seymour-nexus-command-center-web
      APP_PORT: 8080

  postgres:
    image: postgres:18
    restart: on-failure
    init: true

    environment:
      POSTGRES_DB: nexus_platform
      POSTGRES_USER: nexus_app
      POSTGRES_PASSWORD: nexus_umbrel_local

    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql

    networks:
      default:
        aliases:
          - seymour-nexus-command-center-postgres

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U nexus_app -d nexus_platform
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrate:
    image: ghcr.io/imdmanuc2/nexus-command-center:dev
    restart: "no"

    environment:
      NEXUS_DB_HOST: seymour-nexus-command-center-postgres
      NEXUS_DB_PORT: "5432"
      NEXUS_DB_NAME: nexus_platform
      NEXUS_DB_USER: nexus_app
      NEXUS_DB_PASSWORD: nexus_umbrel_local

    command:
      - python
      - /opt/nexus/scripts/run_nexus_migrations.py
      - --apply

    depends_on:
      postgres:
        condition: service_healthy

  peer:
    image: ghcr.io/imdmanuc2/nexus-command-center:dev
    restart: on-failure

    env_file:
      - path: ${APP_DATA_DIR}/data/private/nexus-identity.env
        required: false
      - path: ${APP_DATA_DIR}/data/private/nexus-peer.env
        required: false

    environment:
      NEXUS_PEER_HTTP_HOST: 0.0.0.0
      NEXUS_PEER_HTTP_PORT: "8561"

      NEXUS_DB_HOST: seymour-nexus-command-center-postgres
      NEXUS_DB_PORT: "5432"
      NEXUS_DB_NAME: nexus_platform
      NEXUS_DB_USER: nexus_app
      NEXUS_DB_PASSWORD: nexus_umbrel_local

    command:
      - python
      - -m
      - backend.api.nexus_peer_server

    ports:
      - "8561:8561"

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test "$$(curl --silent --output /dev/null
          --write-out '%{http_code}'
          http://127.0.0.1:8561/api/nexus/identity)"
          = "401"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    volumes:
      - /etc/machine-id:/etc/machine-id:ro
      - ${APP_DATA_DIR}/data/private:/opt/nexus/backend/data/private
      - ${APP_DATA_DIR}/data/runtime:/opt/nexus/backend/data/runtime

    networks:
      default:
        aliases:
          - seymour-nexus-command-center-peer

    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    image: ghcr.io/imdmanuc2/nexus-command-center:dev
    restart: on-failure

    env_file:
      - path: ${APP_DATA_DIR}/data/private/nexus-identity.env
        required: false
      - path: ${APP_DATA_DIR}/data/private/nexus-peer.env
        required: false

    environment:
      NEXUS_HTTP_HOST: 0.0.0.0
      NEXUS_HTTP_PORT: "8080"
      NEXUS_LOCAL_DISCOVERY_STATE_PATH: /opt/nexus/backend/data/runtime/nexus-local-discovery.json

      NEXUS_DB_HOST: seymour-nexus-command-center-postgres
      NEXUS_DB_PORT: "5432"
      NEXUS_DB_NAME: nexus_platform
      NEXUS_DB_USER: nexus_app
      NEXUS_DB_PASSWORD: nexus_umbrel_local

    volumes:
      - /etc/machine-id:/etc/machine-id:ro
      - ${APP_DATA_DIR}/data/private:/opt/nexus/backend/data/private
      - ${APP_DATA_DIR}/data/runtime:/opt/nexus/backend/data/runtime

    networks:
      default:
        aliases:
          - seymour-nexus-command-center-web

    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
