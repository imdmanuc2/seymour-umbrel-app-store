id: seymour-nexus-command-center
name: Nexus Command Center
tagline: Advanced management for miners, pools, blockchain nodes and infrastructure
icon: https://raw.githubusercontent.com/imdmanuc2/seymour-umbrel-app-store/develop/assets/icons/nexus-command-center.png
category: Platform
version: "0.1.6-alpha"
port: 8560
description: >-
  Nexus Command Center is the primary management platform for the Seymour Mining Suite.
  Use Nexus to monitor and operate miners, pools, blockchain nodes, storage, infrastructure,
  alerts, health, topology and system relationships from one interface.
  
  For blockchain deployments, Nexus provides advanced installation features including
  storage-target selection, remote or network storage, lifecycle management, diagnostics,
  recovery workflows and CMDB-backed infrastructure relationships.
