name: Build Seymour Bitcoin Node Multi-Arch
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "runtime-images/bitcoin-core/**"
      - ".github/workflows/seymour-bitcoin-node-multiarch.yml"
permissions:
  contents: read
  packages: write
env:
  IMAGE_NAME: ghcr.io/imdmanuc2/seymour-bitcoin-node
  BITCOIN_VERSION: "29.0"

jobs:
  build-platform:
    name: build-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.arch }}
        shell: bash
        run: |
          set -euxo pipefail
          docker buildx build \
            --progress=plain \
            --platform "${{ matrix.platform }}" \
            --build-arg "BITCOIN_VERSION=${BITCOIN_VERSION}" \
            --tag "${IMAGE_NAME}:${BITCOIN_VERSION}-${{ matrix.arch }}" \
            --push \
            runtime-images/bitcoin-core
      - name: Inspect architecture tag
        run: |
          docker buildx imagetools inspect \
            "${IMAGE_NAME}:${BITCOIN_VERSION}-${{ matrix.arch }}"

  publish-manifest:
    name: publish-manifest
    runs-on: ubuntu-latest
    needs: [build-platform]
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify architecture tags exist
        run: |
          docker buildx imagetools inspect "${IMAGE_NAME}:${BITCOIN_VERSION}-amd64"
          docker buildx imagetools inspect "${IMAGE_NAME}:${BITCOIN_VERSION}-arm64"
      - name: Publish canonical multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${BITCOIN_VERSION}" \
            "${IMAGE_NAME}:${BITCOIN_VERSION}-amd64" \
            "${IMAGE_NAME}:${BITCOIN_VERSION}-arm64"
      - name: Verify canonical manifest
        run: |
          docker buildx imagetools inspect "${IMAGE_NAME}:${BITCOIN_VERSION}" | tee /tmp/manifest.txt
          grep -q 'linux/amd64' /tmp/manifest.txt
          grep -q 'linux/arm64' /tmp/manifest.txt
