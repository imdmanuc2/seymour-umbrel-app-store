name: Build Seymour Bitcoin Node Multi-Arch

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "runtime-images/bitcoin-core/**"
      - ".github/workflows/seymour-bitcoin-node-multiarch.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/imdmanuc2/seymour-bitcoin-node
  BITCOIN_VERSION: "29.0"

jobs:
  build-platform:
    name: build-${{ matrix.arch }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            release_arch: x86_64
            platform: linux/amd64
          - arch: arm64
            release_arch: aarch64
            platform: linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and verify Bitcoin Core release
        shell: bash
        run: |
          set -euxo pipefail

          RELEASE_DIR="runtime-images/bitcoin-core/staged/${{ matrix.arch }}"
          mkdir -p "${RELEASE_DIR}"

          BASE_URL="https://bitcoincore.org/bin/bitcoin-core-${BITCOIN_VERSION}"
          ARCHIVE="bitcoin-${BITCOIN_VERSION}-${{ matrix.release_arch }}-linux-gnu.tar.gz"

          curl \
            --fail \
            --show-error \
            --location \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 20 \
            --max-time 900 \
            --output "/tmp/${ARCHIVE}" \
            "${BASE_URL}/${ARCHIVE}"

          curl \
            --fail \
            --show-error \
            --location \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --connect-timeout 20 \
            --max-time 120 \
            --output /tmp/SHA256SUMS \
            "${BASE_URL}/SHA256SUMS"

          (
            cd /tmp
            grep "  ${ARCHIVE}$" SHA256SUMS > SHA256SUMS.selected
            sha256sum -c SHA256SUMS.selected
            tar -xzf "${ARCHIVE}"
          )

          install -m 0755 \
            "/tmp/bitcoin-${BITCOIN_VERSION}/bin/bitcoind" \
            "${RELEASE_DIR}/bitcoind"

          install -m 0755 \
            "/tmp/bitcoin-${BITCOIN_VERSION}/bin/bitcoin-cli" \
            "${RELEASE_DIR}/bitcoin-cli"

          ls -lh "${RELEASE_DIR}"
          sha256sum \
            "${RELEASE_DIR}/bitcoind" \
            "${RELEASE_DIR}/bitcoin-cli"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.arch }}
        shell: bash
        run: |
          set -euxo pipefail

          docker buildx build \
            --progress=plain \
            --platform "${{ matrix.platform }}" \
            --tag "${IMAGE_NAME}:${BITCOIN_VERSION}-${{ matrix.arch }}" \
            --push \
            runtime-images/bitcoin-core

      - name: Inspect architecture tag
        shell: bash
        run: |
          set -euxo pipefail

          docker buildx imagetools inspect \
            "${IMAGE_NAME}:${BITCOIN_VERSION}-${{ matrix.arch }}"

  publish-manifest:
    name: publish-manifest
    runs-on: ubuntu-latest
    needs: [build-platform]

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify architecture tags exist
        shell: bash
        run: |
          set -euxo pipefail

          docker buildx imagetools inspect \
            "${IMAGE_NAME}:${BITCOIN_VERSION}-amd64"

          docker buildx imagetools inspect \
            "${IMAGE_NAME}:${BITCOIN_VERSION}-arm64"

      - name: Publish canonical multi-arch manifest
        shell: bash
        run: |
          set -euxo pipefail

          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${BITCOIN_VERSION}" \
            "${IMAGE_NAME}:${BITCOIN_VERSION}-amd64" \
            "${IMAGE_NAME}:${BITCOIN_VERSION}-arm64"

      - name: Verify canonical manifest
        shell: bash
        run: |
          set -euxo pipefail

          docker buildx imagetools inspect \
            "${IMAGE_NAME}:${BITCOIN_VERSION}" \
            | tee /tmp/seymour-bitcoin-manifest.txt

          grep -q 'linux/amd64' \
            /tmp/seymour-bitcoin-manifest.txt

          grep -q 'linux/arm64' \
            /tmp/seymour-bitcoin-manifest.txt
