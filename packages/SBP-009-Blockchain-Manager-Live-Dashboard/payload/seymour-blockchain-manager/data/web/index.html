<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seymour Blockchain Manager</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">SEYMOUR PLATFORM</p>
        <h1>Blockchain Manager</h1>
        <p class="subtitle">
          Live blockchain and host operations from one catalog.
        </p>
      </div>
      <div class="hero-status">
        <span id="catalogStatus">Loading…</span>
      </div>
    </header>

    <section class="host-panel" id="hostPanel">
      <article><span>CPU</span><strong id="hostCpu">—</strong></article>
      <article><span>Memory</span><strong id="hostMemory">—</strong></article>
      <article><span>Storage free</span><strong id="hostStorage">—</strong></article>
      <article><span>Docker</span><strong id="hostDocker">—</strong></article>
      <article><span>Architecture</span><strong id="hostArchitecture">—</strong></article>
    </section>

    <section class="summary">
      <article>
        <span class="summary-label">Providers</span>
        <strong id="providerCount">—</strong>
      </article>
      <article>
        <span class="summary-label">Available now</span>
        <strong id="liveCount">—</strong>
      </article>
      <article>
        <span class="summary-label">Coming soon</span>
        <strong id="plannedCount">—</strong>
      </article>
    </section>

    <section class="toolbar">
      <div class="filters" id="filters"></div>
      <input
        id="search"
        type="search"
        placeholder="Search chains, tickers, algorithms…"
      >
    </section>

    <section id="providerGrid" class="provider-grid">
      <p class="loading">Loading provider catalog…</p>
    </section>
  </main>

  <dialog id="providerDialog">
    <button class="dialog-close" id="closeDialog">×</button>
    <div id="dialogContent"></div>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
