name: Build Seymour Bitcoin Node Multi-Arch

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - "runtime-images/bitcoin-core/**"
      - ".github/workflows/seymour-bitcoin-node-multiarch.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/imdmanuc2/seymour-bitcoin-node
  BITCOIN_VERSION: "29.0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: runtime-images/bitcoin-core
          file: runtime-images/bitcoin-core/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            BITCOIN_VERSION=${{ env.BITCOIN_VERSION }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.BITCOIN_VERSION }}

      - name: Inspect published manifest
        run: |
          docker buildx imagetools inspect \
            "${IMAGE_NAME}:${BITCOIN_VERSION}"
