services:
  app_proxy:
    environment:
      APP_HOST: seymour-bch-node_status_1
      APP_PORT: 8080
  node:
    networks:
      default:
        aliases:
          - seymour-bch-node-rpc
    entrypoint:
      - /usr/local/bin/seymour-entrypoint
    image: ghcr.io/imdmanuc2/seymour-bitcoin-cash-node:29.1.0
    restart: on-failure
    stop_grace_period: 2m
    healthcheck:
      test:
        - CMD-SHELL
        - test -r /proc/1/comm && grep -qx bitcoind /proc/1/comm
      interval: 60s
      timeout: 5s
      start_period: 90s
      retries: 3
    volumes:
      - ${SEYMOUR_BLOCKCHAIN_LOCAL_DATA_PATH:-${APP_DATA_DIR}/data/node}:/data
      - >-
        ${SEYMOUR_BLOCKCHAIN_BLOCKS_PATH:-${APP_DATA_DIR}/data/node/blocks}:/data/blocks
      - ${APP_DATA_DIR}/data/generated:/generated
      - ${APP_DATA_DIR}/data/state:/state
      - >-
        ${APP_DATA_DIR}/data/node/entrypoint.sh:/usr/local/bin/seymour-entrypoint:ro
    environment:
      BCH_DATA_DIR: /data
      BCH_CONFIG_DIR: /generated
      BCH_STATE_DIR: /state
      BCH_RPC_USER: ${BCH_RPC_USER:-seymour_rpc}
      BCH_RPC_PASSWORD: ${BCH_RPC_PASSWORD:-change-me-before-production}
    ports:
      - '8333:8333'
  status:
    image: python:3.12-alpine
    restart: on-failure
    working_dir: /app
    command:
      - python
      - /app/app.py
    environment:
      BCH_RPC_HOST: seymour-bch-node-rpc
      BCH_RPC_PORT: '8332'
      BCH_RPC_USER: ${BCH_RPC_USER:-seymour_rpc}
      BCH_RPC_PASSWORD: ${BCH_RPC_PASSWORD:-change-me-before-production}
      BCH_DATA_PATH: /node-data
      BCH_PROVISIONING_STATE_DIR: /state
    volumes:
      - ${APP_DATA_DIR}/data/status:/app:ro
      - >-
        ${SEYMOUR_BLOCKCHAIN_LOCAL_DATA_PATH:-${APP_DATA_DIR}/data/node}:/node-data
      - >-
        ${SEYMOUR_BLOCKCHAIN_BLOCKS_PATH:-${APP_DATA_DIR}/data/node/blocks}:/node-data/blocks
      - ${APP_DATA_DIR}/data/state:/state
      - ${APP_DATA_DIR}/data/contracts:/contracts:ro
      - ${APP_DATA_DIR}/data/provisioning:/provisioning:ro
    depends_on:
      - node
