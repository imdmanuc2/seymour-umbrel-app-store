<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seymour Bitcoin Cash Node</title><style>body{margin:0;background:#090d12;color:#f3f7fb;font-family:system-ui}main{width:min(1000px,calc(100% - 32px));margin:auto;padding:48px 0}small{color:#58d69a;font-weight:800;letter-spacing:.12em}h1{font-size:52px;margin:10px 0}p{color:#9ba9b8}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:30px}.card,.panel{background:#10171e;border:1px solid #25313d;border-radius:15px;padding:22px}.card span{display:block;color:#8392a1;font-size:13px}.card b{font-size:28px}.panel{margin-top:16px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}h1{font-size:38px}}</style></head><body><main><small>SEYMOUR BLOCKCHAIN PLATFORM</small><h1>Bitcoin Cash Node</h1><p>Persistent BCH infrastructure for Seymour mining services.</p><section class="grid"><div class="card"><span>Status</span><b id="status">Starting</b></div><div class="card"><span>Blocks</span><b id="blocks">—</b></div><div class="card"><span>Headers</span><b id="headers">—</b></div><div class="card"><span>Peers</span><b id="peers">—</b></div></section><section class="panel"><h2>Provisioning</h2><p>SBP-001 installs the app foundation. Guided fresh sync, node copy, backup restore, and remote RPC arrive in later packages.</p></section></main><script>async function r(){try{const d=await(await fetch('/api/status')).json();for(const k of ['status','blocks','headers','peers'])document.getElementById(k).textContent=d[k]??'—'}catch(e){}}r();setInterval(r,5000)</script></body></html>
