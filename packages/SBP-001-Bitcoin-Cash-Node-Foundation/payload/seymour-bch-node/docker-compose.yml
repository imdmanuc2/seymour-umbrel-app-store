services:
  app_proxy:
    environment:
      APP_HOST: seymour-bch-node_status_1
      APP_PORT: 8080

  node:
    image: zquestz/bitcoin-cash-node:latest
    restart: on-failure
    stop_grace_period: 2m
    volumes:
      - ${APP_DATA_DIR}/data/node:/data
      - ${APP_DATA_DIR}/data/generated:/generated
      - ./data/node/entrypoint.sh:/usr/local/bin/seymour-entrypoint:ro
    environment:
      BCH_RPC_USER: ${BCH_RPC_USER:-seymour_rpc}
      BCH_RPC_PASSWORD: ${BCH_RPC_PASSWORD:-change-me-before-production}
    command: ["/usr/local/bin/seymour-entrypoint"]
    ports:
      - "8333:8333"

  status:
    build:
      context: ./data/status
    restart: on-failure
    environment:
      BCH_RPC_HOST: node
      BCH_RPC_PORT: "8332"
      BCH_RPC_USER: ${BCH_RPC_USER:-seymour_rpc}
      BCH_RPC_PASSWORD: ${BCH_RPC_PASSWORD:-change-me-before-production}
    volumes:
      - ./data/contracts:/contracts:ro
      - ./data/provisioning:/provisioning:ro
    depends_on:
      - node
