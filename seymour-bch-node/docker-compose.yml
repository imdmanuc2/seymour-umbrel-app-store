services:
  app_proxy:
    environment:
      APP_HOST: seymour-bch-node_status_1
      APP_PORT: 8080

  node:
    entrypoint: ["/usr/local/bin/seymour-entrypoint"]
    image: ghcr.io/imdmanuc2/seymour-bitcoin-cash-node:29.1.0
    restart: on-failure
    stop_grace_period: 2m

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          output="$$(bitcoin-cli
          -conf=$${BCH_CONFIG_DIR:-/generated}/bitcoin.conf
          -datadir=$${BCH_DATA_DIR:-/data}
          -rpcconnect=127.0.0.1
          -rpcport=$${BCH_RPC_PORT:-8332}
          -rpcwait
          -rpcwaittimeout=5
          uptime 2>&1)";
          rc=$$?;
          if [ "$$rc" -eq 0 ]; then exit 0; fi;
          echo "$$output" | grep -qi "server in warmup" && exit 0;
          echo "$$output" >&2;
          exit "$$rc"
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5

    volumes:
      - ${APP_DATA_DIR}/data/node:/data
      - ${APP_DATA_DIR}/data/generated:/generated
      - ${APP_DATA_DIR}/data/state:/state
      - ${APP_DATA_DIR}/data/node/entrypoint.sh:/usr/local/bin/seymour-entrypoint:ro

    environment:
      BCH_DATA_DIR: /data
      BCH_CONFIG_DIR: /generated
      BCH_STATE_DIR: /state
      BCH_RPC_USER: ${BCH_RPC_USER:-seymour_rpc}
      BCH_RPC_PASSWORD: ${BCH_RPC_PASSWORD:-change-me-before-production}

    ports:
      - "8333:8333"

  status:
    image: python:3.12-alpine
    restart: on-failure
    working_dir: /app

    command:
      - python
      - /app/app.py

    environment:
      BCH_RPC_HOST: node
      BCH_RPC_PORT: "8332"
      BCH_RPC_USER: ${BCH_RPC_USER:-seymour_rpc}
      BCH_RPC_PASSWORD: ${BCH_RPC_PASSWORD:-change-me-before-production}
      BCH_DATA_PATH: /node-data
      BCH_PROVISIONING_STATE_DIR: /state

    volumes:
      - ${APP_DATA_DIR}/data/status:/app:ro
      - ${APP_DATA_DIR}/data/node:/node-data
      - ${APP_DATA_DIR}/data/state:/state
      - ${APP_DATA_DIR}/data/contracts:/contracts:ro
      - ${APP_DATA_DIR}/data/provisioning:/provisioning:ro

    depends_on:
      - node
