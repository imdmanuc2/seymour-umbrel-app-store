name: Seymour Bitcoin Cash Node
tagline: Bitcoin Cash full node with simple local Umbrel installation
icon: https://raw.githubusercontent.com/imdmanuc2/seymour-umbrel-app-store/develop/assets/icons/bitcoin-cash-node.png
category: Blockchain
