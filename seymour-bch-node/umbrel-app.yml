description: >-
  Run a Seymour-supported Bitcoin Cash full node on Umbrel.
  
  Installing Bitcoin Cash directly from the Seymour Umbrel App Store uses local Umbrel
  storage with standard deployment defaults.
  
  For advanced deployment, install Nexus Command Center and open Blockchain. Nexus supports
  storage-target selection, remote or network storage, centralized monitoring, lifecycle
  operations, diagnostics, recovery workflows and CMDB-backed infrastructure management.
  
  Mining Bitcoin Cash? Seymour Pool Engine provides the Seymour-managed mining pool and
  Stratum platform for supported Bitcoin Cash mining workflows.
