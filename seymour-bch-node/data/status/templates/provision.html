<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Provision Bitcoin Cash</title>
<style>
body{margin:0;background:#090d12;color:#f4f7fb;font-family:system-ui}
main{width:min(980px,calc(100% - 32px));margin:auto;padding:42px 0}
.panel{background:#10171e;border:1px solid #26313d;border-radius:16px;padding:22px;margin:16px 0}
label{display:block;margin:12px 0;color:#c7d1db}
input,select,button{width:100%;padding:12px;border-radius:10px;border:1px solid #354251;background:#0b1117;color:#fff}
button{background:#32b879;border:none;font-weight:800;cursor:pointer}
small,p{color:#98a7b6}
pre{white-space:pre-wrap}
</style>
</head>
<body>
<main>
<h1>Provision Bitcoin Cash</h1>
<p>Create and apply a fresh-sync configuration.</p>

<form id="wizard">
<section class="panel">
<h2>Setup Experience</h2>
<label><input type="radio" name="experience" value="recommended" checked> Recommended</label>
<label><input type="radio" name="experience" value="advanced"> Advanced</label>
</section>

<section class="panel">
<h2>Provisioning Mode</h2>
<label><input type="radio" name="mode" value="fresh-sync" checked> Synchronize a new BCH node</label>
<label><input type="radio" name="mode" value="copy-existing"> Copy existing node</label>
<label><input type="radio" name="mode" value="restore-backup"> Restore backup</label>
<label><input type="radio" name="mode" value="remote-rpc"> Remote RPC</label>
</section>

<section class="panel advanced">
<h2>Advanced Fresh-Sync Options</h2>
<label>Version profile
<select name="versionProfile">
<option value="seymour-recommended">Seymour Recommended</option>
<option value="latest-stable">Latest Stable</option>
<option value="specific">Specific Version</option>
</select>
</label>
<label>Specific version <input name="specificVersion"></label>
<label>Storage path <input name="storagePath" value="/data"></label>
<label>Prune MiB <input name="prune" value="0"></label>
<label>Transaction index
<select name="txindex">
<option value="1">Enabled</option>
<option value="0" selected>Disabled</option>
</select>
</label>
</section>

<section class="panel">
<button type="button" id="plan">Preview Plan</button>
<br><br>
<button type="submit">Apply Fresh-Sync Configuration</button>
<p>Applying saves configuration and generates RPC credentials. It does not install or start the app.</p>
</section>
</form>

<section class="panel">
<h2>Result</h2>
<pre id="result">No action yet.</pre>
</section>
</main>

<script>
const form=document.getElementById('wizard');
const result=document.getElementById('result');
function params(){return new URLSearchParams(new FormData(form));}
function refresh(){
 const data=new FormData(form);
 document.querySelector('.advanced').style.display=
   data.get('experience')==='advanced'?'block':'none';
}
form.addEventListener('change',refresh);
document.getElementById('plan').addEventListener('click',async()=>{
 const r=await fetch('/api/provisioning/plan',{method:'POST',body:params()});
 result.textContent=JSON.stringify(await r.json(),null,2);
});
form.addEventListener('submit',async(e)=>{
 e.preventDefault();
 const r=await fetch('/api/provisioning/apply',{method:'POST',body:params()});
 result.textContent=JSON.stringify(await r.json(),null,2);
});
refresh();
</script>
</body>
</html>
