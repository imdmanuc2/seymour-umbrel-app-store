id: seymour-bitcoin-node
name: Bitcoin Core
tagline: Bitcoin Core full node with simple local Umbrel installation
icon: https://raw.githubusercontent.com/imdmanuc2/seymour-umbrel-app-store/develop/assets/icons/bitcoin-core.png
category: Blockchain
version: "0.2.1"
