services:
  app_proxy:
    environment:
      APP_HOST: seymour-bitcoin-node_status_1
      APP_PORT: 8080

  node:
    image: ghcr.io/imdmanuc2/seymour-bitcoin-node:29.0.0
    entrypoint:
      - /usr/local/bin/seymour-entrypoint

    restart: on-failure
    stop_grace_period: 2m

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          output="$$(bitcoin-cli
          -conf=$${BTC_CONFIG_DIR:-/generated}/bitcoin.conf
          -datadir=$${BTC_DATA_DIR:-/data}
          -rpcconnect=127.0.0.1
          -rpcport=8332
          -rpcwait
          -rpcwaittimeout=5
          uptime 2>&1)";
          rc=$$?;
          if [ "$$rc" -eq 0 ]; then exit 0; fi;
          echo "$$output" | grep -qi "server in warmup" && exit 0;
          echo "$$output" >&2;
          exit "$$rc"

      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5

    environment:
      BTC_DATA_DIR: /data
      BTC_CONFIG_DIR: /generated
      BTC_STATE_DIR: /state
      BTC_RPC_USER: ${BTC_RPC_USER:-seymour_rpc}
      BTC_RPC_PASSWORD: ${BTC_RPC_PASSWORD:-change-me-before-production}

    volumes:
      - ${SEYMOUR_BLOCKCHAIN_DATA_PATH:-${APP_DATA_DIR}/data/node}:/data
      - ${APP_DATA_DIR}/data/generated:/generated
      - ${APP_DATA_DIR}/data/state:/state
      - >-
        ${APP_DATA_DIR}/data/node/entrypoint.sh:/usr/local/bin/seymour-entrypoint:ro

    ports:
      - "8333:8333"

  status:
    image: python:3.12-alpine
    restart: on-failure
    working_dir: /app

    command:
      - python
      - /app/app.py

    environment:
      BTC_RPC_HOST: node
      BTC_RPC_PORT: "8332"
      BTC_RPC_USER: ${BTC_RPC_USER:-seymour_rpc}
      BTC_RPC_PASSWORD: ${BTC_RPC_PASSWORD:-change-me-before-production}
      BTC_DATA_PATH: /node-data

    volumes:
      - ${APP_DATA_DIR}/data/status:/app:ro
      - ${SEYMOUR_BLOCKCHAIN_DATA_PATH:-${APP_DATA_DIR}/data/node}:/node-data:ro
      - ${APP_DATA_DIR}/data/contracts:/contracts:ro

    depends_on:
      - node
