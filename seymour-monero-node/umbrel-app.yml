tagline: Monero full node with simple local Umbrel installation
icon: https://raw.githubusercontent.com/imdmanuc2/seymour-umbrel-app-store/develop/assets/icons/monero-node.png
description: >-
  Run a Seymour-supported Monero mainnet node on Umbrel.
  
  Installing Monero directly from the Seymour Umbrel App Store uses local Umbrel storage
  with standard deployment defaults.
  
  For advanced deployment, install Nexus Command Center and open Blockchain. Nexus provides
  storage-target selection, remote or network storage, centralized monitoring, lifecycle
  operations, diagnostics, recovery workflows and CMDB-backed infrastructure management.
  
  For supported Monero mining workflows, Seymour Pool Engine is the Seymour-managed mining
  and Stratum platform.
